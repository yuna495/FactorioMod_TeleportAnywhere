[mod-name]
TeleportAnywhere=Teleport Anywhere

[mod-description]
TeleportAnywhere=Player-only teleport between safe points on the current planet and previously visited planets.

[controls]
teleport-anywhere-toggle-gui=Open Teleport Anywhere

[item-name]
teleport-anywhere-map-tool=Map teleport selector

[item-description]
teleport-anywhere-map-tool=Select a destination on the current planet.

